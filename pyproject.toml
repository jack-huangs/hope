[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-mdt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
medcpt = ["torch>=2.2", "transformers>=4.40", "numpy>=1.26"]
test = ["pytest>=8"]

[project.scripts]
evidence-mdt = "evidence_mdt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
